name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job, not the library's three: there is no Fortran toolchain to provision
# and no version matrix to cover, because Streamlit requires Python >= 3.10 and
# the app is deployed on a single interpreter.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The interpreter comes from .python-version, the one place it is
      # declared. uv reads that same file when it creates a local venv, so a
      # developer's environment matches CI without anyone having to remember a
      # number; without the file uv falls back to its own default and can put
      # someone on a different interpreter silently. Streamlit itself only
      # requires >= 3.10 -- 3.12 is what this app is developed and tested on.
      # Streamlit Community Cloud's version is set in the app's own settings,
      # not from this repository, and has to be kept in step by hand.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      # Installs flowfreq from the pinned tag, so CI performs the same
      # resolution Streamlit Cloud does on deploy. A broken pin fails here
      # rather than in production.
      # Both files, and no inline pins: requirements-dev.txt is what a
      # developer installs too, so the linter versions here and on a
      # workstation cannot drift. They previously lived only in this file,
      # which is how a local black 26 came to disagree with CI's black 24.
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Same targets a developer runs, so the two cannot drift.
      - name: Lint
        run: make lint

      - name: Test
        run: make test
