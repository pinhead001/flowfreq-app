# The app is a deployed Streamlit script, not a distribution, so there is no
# [project] table and nothing to build. This file exists to hold the lint and
# test configuration, so black/isort settings cannot drift from the flowfreq
# library's and a file moved between the two repos formats identically.

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ffa_runner", "ffa_export", "streamlit_app"]
# flowfreq is an installed dependency, never local source. Declared explicitly
# because isort otherwise infers placement from what it finds on disk: a stray
# flowfreq/ directory in the tree -- leftover __pycache__ from before the split,
# say, or a sibling checkout of the library -- silently reclassifies it as
# first-party, and the file then passes `isort --check` locally while failing in
# CI's clean checkout. That exact divergence cost a red build here.
known_third_party = ["flowfreq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
